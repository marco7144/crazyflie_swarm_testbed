services:
  swarm-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: crazyflie-swarm-testbed:jazzy
    container_name: crazyflie_swarm_dev
    #user: "UID:GID"
    user: "1000:1000"
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:1}
      - XDG_RUNTIME_DIR=/tmp/runtime-prisma
      - LIBGL_ALWAYS_SOFTWARE=0
      - USER=prisma
      - USERNAME=prisma
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Mount ROS 2 workspace source code
      - ./ros2_ws:/home/prisma/ros2_ws
      # Mount CrazySim simulation framework and SITL firmware
      - ./CrazySim:/home/prisma/CrazySim
      # Mount Crazyflow simulator
      - ./crazyflow:/home/prisma/crazyflow
      # Native Linux X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    stdin_open: true
    tty: true
