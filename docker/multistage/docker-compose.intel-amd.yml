# Shared configuration across all simulator profiles for Intel/AMD GPUs (YAML extension field)
# Ref: https://docs.docker.com/reference/compose-file/extension/
# Ref: https://docs.docker.com/compose/how-tos/profiles/
x-common: &common
  user: "1000:1000"
  group_add:
    - "${RENDER_GID:-110}" # GID del gruppo 'render' host (sovrascrivibile via env/.env)
    - "${VIDEO_GID:-44}"   # GID del gruppo 'video' host (sovrascrivibile via env/.env)
  network_mode: host
  ipc: host
  privileged: true
  environment:
    - DISPLAY=${DISPLAY:-:1}
    - XDG_RUNTIME_DIR=/tmp/runtime-prisma
    - LIBGL_ALWAYS_SOFTWARE=0
    - DRI_PRIME=1
    - USER=prisma
    - USERNAME=prisma
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
  volumes:
    # Mount ROS 2 workspace source code
    - ../../ros2_ws:/home/prisma/ros2_ws
    # Mount CrazySim simulation framework and SITL firmware
    - ../../CrazySim:/home/prisma/CrazySim
    # Mount Crazyflow simulator
    - ../../crazyflow:/home/prisma/crazyflow
    # Native Linux X11 socket for GUI
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  devices:
    # Direct access to DRI for Intel/AMD GPU acceleration
    - /dev/dri:/dev/dri
  stdin_open: true
  tty: true

services:
  base:
    <<: *common
    profiles: ["base"]
    build:
      context: ../..
      dockerfile: docker/multistage/Dockerfile
      target: base
    image: crazyflie-swarm-testbed:base
    container_name: crazyflie_swarm_base

  webots:
    <<: *common
    profiles: ["webots"]
    build:
      context: ../..
      dockerfile: docker/multistage/Dockerfile
      target: webots
    image: crazyflie-swarm-testbed:webots
    container_name: crazyflie_swarm_webots

  gazebo:
    <<: *common
    profiles: ["gazebo"]
    build:
      context: ../..
      dockerfile: docker/multistage/Dockerfile
      target: gazebo
    image: crazyflie-swarm-testbed:gazebo
    container_name: crazyflie_swarm_gazebo

  mujoco:
    <<: *common
    profiles: ["mujoco"]
    build:
      context: ../..
      dockerfile: docker/multistage/Dockerfile
      target: mujoco
    image: crazyflie-swarm-testbed:mujoco
    container_name: crazyflie_swarm_mujoco

  crazyflow:
    <<: *common
    profiles: ["crazyflow"]
    build:
      context: ../..
      dockerfile: docker/multistage/Dockerfile
      target: crazyflow
    image: crazyflie-swarm-testbed:crazyflow
    container_name: crazyflie_swarm_crazyflow

  full:
    <<: *common
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: docker/multistage/Dockerfile
      target: full
    image: crazyflie-swarm-testbed:full
    container_name: crazyflie_swarm_full
