# Configurazione Crazyswarm2 per simulazione Webots
/crazyflie_server:
  ros__parameters:
    warnings:
      frequency: 1.0
    firmware_params:
      commander:
        enHighLevel: 1
      stabilizer:
        estimator: 2   # kalman
        controller: 1  # pid
    sim:
      max_dt: 0.01     # 100 Hz aggiornamento setpoint traiettorie
      backend: webots
      controller: none # Il PID gira localmente a frequenza fisica in CrazyflieDriver.cpp
      visualizations:
        rviz:
          enabled: true
        gui:
          enabled: false
        record_states:
          enabled: false
        pdf:
          enabled: false
