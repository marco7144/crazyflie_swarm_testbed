services:
  swarm-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: crazyflie-swarm-testbed:jazzy
    container_name: crazyflie_swarm_dev
    user: "1000:1000"
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - XDG_RUNTIME_DIR=/tmp/runtime-prisma
      - LIBGL_ALWAYS_SOFTWARE=0
      - USER=prisma
      - USERNAME=prisma
    volumes:
      # Mount ROS 2 workspace source code
      - ./ros2_ws:/home/prisma/ros2_ws
      # Native Linux X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      # Direct access to DRI for GPU acceleration
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
